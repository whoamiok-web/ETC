<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#1446B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A2A6E" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 배경 (iOS가 모서리를 둥글게 잘라줌) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- 집 -->
  <g filter="url(#shadow)">
    <path d="M512 196 L842 470 Q866 490 842 510 L806 510 L806 792 Q806 836 762 836 L262 836 Q218 836 218 792 L218 510 L182 510 Q158 490 182 470 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="36" stroke-linejoin="round"/>
    <!-- 굴뚝 -->
    <rect x="676" y="250" width="72" height="150" rx="16" fill="#FFFFFF"/>
  </g>
  <!-- 동전 -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="632" r="168" fill="url(#coin)"/>
    <circle cx="512" cy="632" r="136" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="12"/>
  </g>
  <!-- ₩ -->
  <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430 548 L468 716 L512 588 L556 716 L594 548"/>
    <path d="M416 616 L608 616"/>
    <path d="M422 656 L602 656"/>
  </g>
</svg>
